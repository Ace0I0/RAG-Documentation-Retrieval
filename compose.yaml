services:
  qdrant: 
    image: qdrant/qdrant
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage

  api:
    build: .
    image: rag-documentation-api:dev
    pull_policy: build
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - QDRANT_URL: http:/qdrant:6333
    depends_on:
      - qdrant

volumes:
  qdrant_storage: